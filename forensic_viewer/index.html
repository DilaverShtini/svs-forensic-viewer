<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Replay / Forensic Viewer</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2b2b36;
            --text-color: #e0e0e0;
            --highlight: #38bdf8;
            --alert: #ef4444;
            --warning: #facc15;
            --info: #3b82f6;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            flex-grow: 1;
            margin-bottom: 15px;
            min-height: 0; 
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid #3f3f4e;
            overflow: hidden;
        }

        .panel-header {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-container {
            position: relative;
            flex-grow: 1;
            background-color: #1a1a24;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            overflow: hidden;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: 1px solid #3f3f4e;
            box-sizing: border-box;
        }
        .bev-canvas { width: 100%; height: 100%; background-color: #1a1a24; }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #3f3f4e;
            color: #94a3b8;
            border: 1px solid transparent;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .filter-btn[data-filter="all"]:hover,
        .filter-btn[data-filter="all"].active-filter {
            background-color: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #38bdf8;
        }

        .filter-btn[data-filter="perception"]:hover,
        .filter-btn[data-filter="perception"].active-filter {
            background-color: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #38bdf8;
        }

        .filter-btn[data-filter="system"]:hover,
        .filter-btn[data-filter="system"].active-filter {
            background-color: rgba(249, 115, 22, 0.2); border-color: #f97316; color: #f97316;
        }

        .filter-btn[data-filter="v2x"]:hover,
        .filter-btn[data-filter="v2x"].active-filter {
            background-color: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: #a855f7;
        }

        .filter-btn[data-filter="critical"]:hover,
        .filter-btn[data-filter="critical"].active-filter {
            background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444;
        }

        .log-list { list-style: none; padding: 0; overflow-y: auto; flex-grow: 1; margin: 0; }
        .log-item { padding: 8px; border-bottom: 1px solid #3f3f4e; cursor: pointer; font-size: 14px; }
        .log-item:hover { background-color: #3f3f4e; }
        .log-item.active { background-color: rgba(56, 189, 248, 0.2); border-left: 4px solid var(--highlight); }

        .timeline-container {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #3f3f4e;
        }

        #play-btn { background: var(--highlight); color: #1e1e24; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .slider-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            height: 20px;
        }
        #timeline-markers {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            top: 0;
            left: 0;
        }
        .timeline-marker {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--alert);
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }
        .timeline-marker:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }
        #timeline-slider {
            width: 100%;
            cursor: pointer;
            position: relative;
            z-index: 2;
            margin: 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">Video Feed | Synchronized</div>
            <div class="video-container">
                <img id="dashcam-img" src="" alt="Dashcam Frame">
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Telemetry Graphs</div>
            <div id="charts-container" style="flex-grow: 1; position: relative;">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Birds-Eye View (BEV)</div>
            <canvas id="bev-canvas" class="bev-canvas"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">Causal Chain / Event Log</div>
            <div class="filters">
                <button class="filter-btn active-filter" data-filter="all">All events</button>
                <button class="filter-btn" data-filter="perception">Obstacles detection</button>
                <button class="filter-btn" data-filter="system">System's actions</button>
                <button class="filter-btn" data-filter="v2x">Network events</button>
                <button class="filter-btn" data-filter="critical">Collisions</button>
            </div>
            <ul class="log-list" id="event-log">
            </ul>
        </div>
    </div>

    <div class="timeline-container">
        <button id="play-btn">PLAY</button>
        <div class="slider-wrapper">
            <div id="timeline-markers"></div> <input type="range" id="timeline-slider" min="0" max="100" value="0" step="1">
        </div>
        <div id="time-display">0.0s</div>
    </div>

    <script src="js/bev_renderer.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
