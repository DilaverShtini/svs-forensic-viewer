<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Replay / Forensic Viewer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">Video Feed | Synchronized</div>
            <div class="video-container">
                <img id="dashcam-img" src="" alt="Dashcam Frame">
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Telemetry Graphs</div>
            <div id="charts-container">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Birds-Eye View (BEV)</div>
            <canvas id="bev-canvas" class="bev-canvas"></canvas>
        </div>

        <div class="panel">
            <div class="panel-header">Causal Chain / Event Log</div>
            <div class="filters">
                <button class="filter-btn active-filter" data-filter="all">All events</button>
                <button class="filter-btn" data-filter="perception">Obstacles detection</button>
                <button class="filter-btn" data-filter="system">System's actions</button>
                <button class="filter-btn" data-filter="v2x">Network events</button>
                <button class="filter-btn" data-filter="critical">Collisions</button>
            </div>
            <ul class="log-list" id="event-log">
            </ul>
        </div>
    </div>

    <div class="timeline-container">
        <button id="play-btn">PLAY</button>
        <div class="slider-wrapper">
            <div id="timeline-markers"></div> 
            <input type="range" id="timeline-slider" min="0" max="100" value="0" step="1">
        </div>
        <div id="time-display">0.0s</div>
    </div>

    <script src="js/bev_renderer.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
